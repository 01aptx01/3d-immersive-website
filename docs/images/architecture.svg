<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">FORM &amp; FRAME · Source architecture</title><desc id="desc">The main router lazy-loads the keyboard or pavilion module. Metadata and HTML wireframes remain separate.</desc><rect width="1200" height="660" rx="20" fill="#181820"/><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif}.k{fill:#ac9bd3;font-size:12px;letter-spacing:2px;font-weight:650}.h{fill:#f5f1e9;font-size:32px;font-weight:650}.t{fill:#f5f1e9;font-size:20px;font-weight:600}.b{fill:#c3c0cb;font-size:15px}.l{fill:#9c97aa;font-size:13px}</style><text x="44" y="44" class="k">FORM &amp; FRAME  /  SOURCE MAP</text><text x="44" y="94" class="h">Independent worlds. Shared entry.</text><text x="44" y="127" class="b">The implemented router selects a scene; the catalog describes the collection.</text><rect x="44" y="174" width="310" height="150" rx="14" fill="#23232e" stroke="#3e3a4d"/><rect x="44" y="192" width="3" height="28" rx="1" fill="#b7a0e0"/><text x="66" y="204" class="k">ENTRY</text><text x="66" y="235" class="t">index.html → main.jsx</text><text x="66" y="265" class="b">Query / exact-path routing</text><text x="66" y="289" class="b">React lazy + Suspense</text><rect x="424" y="174" width="350" height="150" rx="14" fill="#23232e" stroke="#3e3a4d"/><rect x="424" y="192" width="3" height="28" rx="1" fill="#b7a0e0"/><text x="446" y="204" class="k">WORLD 01</text><text x="446" y="235" class="t">keyboard/</text><text x="446" y="265" class="b">App.jsx + KeyboardScene.jsx</text><text x="446" y="289" class="b">store.js + styles.css</text><rect x="424" y="364" width="350" height="150" rx="14" fill="#23232e" stroke="#3e3a4d"/><rect x="424" y="382" width="3" height="28" rx="1" fill="#b7a0e0"/><text x="446" y="394" class="k">WORLD 02</text><text x="446" y="425" class="t">kigumi/</text><text x="446" y="455" class="b">Route.jsx + KigumiScene.jsx</text><text x="446" y="479" class="b">store.js + styles.css + wind</text><rect x="824" y="174" width="330" height="150" rx="14" fill="#23232e" stroke="#3e3a4d"/><rect x="824" y="192" width="3" height="28" rx="1" fill="#b7a0e0"/><text x="846" y="204" class="k">METADATA</text><text x="846" y="235" class="t">worlds/catalog.js</text><text x="846" y="265" class="b">Available / coming-soon worlds</text><text x="846" y="289" class="b">Read by the keyboard interface</text><rect x="824" y="364" width="330" height="150" rx="14" fill="#23232e" stroke="#3e3a4d"/><rect x="824" y="382" width="3" height="28" rx="1" fill="#b7a0e0"/><text x="846" y="394" class="k">SEPARATE ARCHIVE</text><text x="846" y="425" class="t">wireframes/</text><text x="846" y="455" class="b">Standalone HTML + CSS + JS</text><text x="846" y="479" class="b">Its own sample world data</text><g fill="none" stroke="#b7a0e0" stroke-width="2"><path d="M354 249 H404"/><path d="M354 279 H385 V439 H404"/><path d="M824 249 H794" stroke-dasharray="5 5"/></g><g fill="#b7a0e0"><path d="M414 249 l-10 -6 v12z"/><path d="M414 439 l-10 -6 v12z"/><path d="M784 249 l10 -6 v12z"/></g><text x="44" y="554" class="k">CONTROLS → ZUSTAND STATE → SCENE UPDATES</text><text x="44" y="584" class="b">Pavilion route: WebGL 2 preflight + renderer boundary → illustrated fallback when needed</text><text x="44" y="626" class="l">SOURCE  ·  src/main.jsx + src/worlds/ + wireframes/  ·  Documentation diagram, not an app screen</text></svg>