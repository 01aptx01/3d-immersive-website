<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">FORM &amp; FRAME · Technology map</title><desc id="desc">Source-based technology map of this frontend application.</desc><rect width="1200" height="660" rx="20" fill="#181820"/><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif}.k{fill:#ac9bd3;font-size:12px;letter-spacing:2px;font-weight:650}.h{fill:#f5f1e9;font-size:32px;font-weight:650}.t{fill:#f5f1e9;font-size:20px;font-weight:600}.b{fill:#c3c0cb;font-size:15px}.l{fill:#9c97aa;font-size:13px}</style><text x="44" y="44" class="k">FORM &amp; FRAME  /  ENGINEERING NOTES</text><text x="44" y="94" class="h">One browser. Two ways to explore.</text><text x="44" y="127" class="b">JavaScript + JSX · client-side state · no application backend</text><rect x="44" y="164" width="350" height="190" rx="14" fill="#23232e" stroke="#3e3a4d"/><rect x="44" y="182" width="3" height="28" rx="1" fill="#b7a0e0"/><text x="66" y="194" class="k">01  /  INTERFACE</text><text x="66" y="225" class="t">React + Vite</text><text x="66" y="255" class="b">React / React DOM 18.3.1</text><text x="66" y="279" class="b">Vite 6.4.6 + React plugin 4.7.0</text><text x="66" y="303" class="b">Responsive CSS interfaces</text><rect x="424" y="164" width="350" height="190" rx="14" fill="#23232e" stroke="#3e3a4d"/><rect x="424" y="182" width="3" height="28" rx="1" fill="#b7a0e0"/><text x="446" y="194" class="k">02  /  RENDERING</text><text x="446" y="225" class="t">Three.js + React Three Fiber</text><text x="446" y="255" class="b">Three.js 0.171.0 · Fiber 8.18.0</text><text x="446" y="279" class="b">Drei 9.122.0 scene utilities</text><text x="446" y="303" class="b">Procedural + instanced geometry</text><rect x="804" y="164" width="350" height="190" rx="14" fill="#23232e" stroke="#3e3a4d"/><rect x="804" y="182" width="3" height="28" rx="1" fill="#b7a0e0"/><text x="826" y="194" class="k">03  /  INTERACTION</text><text x="826" y="225" class="t">Zustand + GSAP</text><text x="826" y="255" class="b">Zustand 5.1.0 state stores</text><text x="826" y="279" class="b">GSAP 3.15.1 motion timelines</text><text x="826" y="303" class="b">Frame updates and input events</text><rect x="44" y="384" width="540" height="185" rx="14" fill="#23232e" stroke="#3e3a4d"/><rect x="44" y="402" width="3" height="28" rx="1" fill="#b7a0e0"/><text x="66" y="414" class="k">04  /  AUDIO</text><text x="66" y="445" class="t">Two sound paths</text><text x="66" y="475" class="b">Keyboard → browser Web Audio synthesis</text><text x="66" y="499" class="b">Pavilion → Howler.js 2.2.4 + local OGG wind</text><text x="66" y="523" class="b">Audio activation follows browser policy</text><rect x="614" y="384" width="540" height="185" rx="14" fill="#23232e" stroke="#3e3a4d"/><rect x="614" y="402" width="3" height="28" rx="1" fill="#b7a0e0"/><text x="636" y="414" class="k">05  /  PRODUCT ARCHIVE</text><text x="636" y="445" class="t">Standalone HTML wireframes</text><text x="636" y="475" class="b">Five HTML/CSS/JavaScript pages</text><text x="636" y="499" class="b">Local storage for favorites and sample settings</text><text x="636" y="523" class="b">Separate from the React world catalog</text><text x="44" y="618" class="l">LOCKFILE VERSIONS  ·  package-lock.json at b8c0350  ·  Documentation diagram, not an app screen</text></svg>