const FAV_KEY='elsewhere.favorites.v2';const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];function readFav(){try{const v=JSON.parse(localStorage.getItem(FAV_KEY)||'[]');return Array.isArray(v)?v:[]}catch{return[]}}function hasFav(id){return readFav().includes(id)}function toggleFav(id){let a=readFav();a=a.includes(id)?a.filter(x=>x!==id):[...a,id];localStorage.setItem(FAV_KEY,JSON.stringify(a));document.dispatchEvent(new CustomEvent('favorites-changed',{detail:{id,favorites:a}}));return a.includes(id)}function paintHeart(b,id){let on=hasFav(id);b.setAttribute('aria-pressed',String(on));b.setAttribute('aria-label',on?'ลบออกจากรายการโปรด':'เพิ่มในรายการโปรด');b.textContent=on?'♥':'♡'}function toast(msg){let t=$('#toast');if(!t)return;t.textContent=msg;t.classList.add('show');clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>t.classList.remove('show'),2100)}function initNav(){let b=$('.nav-toggle'),n=$('.nav');if(b)b.addEventListener('click',()=>{let open=n.classList.toggle('open');b.setAttribute('aria-expanded',String(open))});let file=location.pathname.split('/').pop()||'index.html';$$('.nav a').forEach(a=>{if(a.getAttribute('href')===file)a.classList.add('active')})}
function worldCard(w){return `<article class="world-card"><a class="card-art scene-${w.scene}" href="world-detail.html?id=${encodeURIComponent(w.id)}" aria-label="เปิดโลก ${w.name}"></a><button class="heart card-heart" data-fav="${w.id}" aria-pressed="false" aria-label="เพิ่มในรายการโปรด">♡</button><div class="card-info"><span class="eyebrow">${w.category}</span><h2>${w.name}</h2><p>${w.short}</p><div class="card-bottom"><span>${w.duration} · ${w.visitors} คนสำรวจ</span><a class="card-open" href="world-detail.html?id=${encodeURIComponent(w.id)}">เข้าไปดู ↗</a></div></div></article>`}function bindHearts(root=document){$$('[data-fav]',root).forEach(b=>{paintHeart(b,b.dataset.fav);if(!b.dataset.bound){b.dataset.bound='1';b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();let id=b.dataset.fav,added=toggleFav(id);paintHeart(b,id);toast(added?'เพิ่มในรายการโปรดแล้ว':'ลบออกจากรายการโปรดแล้ว')})}})}document.addEventListener('favorites-changed',()=>bindHearts());
function initHome(){let main=$('#homeMain');if(!main)return;let idx=0,layers=[$('#sceneOne'),$('#sceneTwo')],front=0,paused=false,hover=false,focused=false,reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,timer=null,copy=$('#heroCopy');let worlds=WORLDS;function show(n){idx=(n+worlds.length)%worlds.length;let w=worlds[idx],next=1-front;let layer=layers[next];layer.className='scene-layer scene-'+w.scene;layer.setAttribute('aria-hidden','true');layer.innerHTML='<div class="scene-orbit"></div><div class="scene-land back"></div><div class="scene-land"></div>';requestAnimationFrame(()=>requestAnimationFrame(()=>{layers[front].classList.remove('active');layer.classList.add('active');front=next}));copy.classList.add('changing');setTimeout(()=>{ $('#heroCategory').textContent=w.category+' · โลกตัวอย่าง';$('#heroTitle').textContent=w.name;$('#heroDesc').textContent=w.short;$('#enterWorld').href=`world-detail.html?id=${encodeURIComponent(w.id)}`;$('#heroFavorite').dataset.fav=w.id;paintHeart($('#heroFavorite'),w.id);$('#slideCount').textContent=String(idx+1).padStart(2,'0')+' / '+String(worlds.length).padStart(2,'0');$$('.indicator').forEach((b,i)=>b.setAttribute('aria-current',String(i===idx)));main.dataset.world=w.id;copy.classList.remove('changing')},240)}function eligible(){return !paused&&!hover&&!focused&&!reduced&&!document.hidden}function start(){clearInterval(timer);if(eligible())timer=setInterval(()=>show(idx+1),4000)}function pauseToggle(){paused=!paused;$('#pauseCarousel').textContent=paused?'▶':'Ⅱ';$('#pauseCarousel').setAttribute('aria-label',paused?'เล่นสไลด์อัตโนมัติ':'หยุดสไลด์อัตโนมัติ');$('#pauseCarousel').title=paused?'เล่นอัตโนมัติ':'หยุดอัตโนมัติ';start()}$('#nextSlide').onclick=()=>{show(idx+1);start()};$('#prevSlide').onclick=()=>{show(idx-1);start()};$('#pauseCarousel').onclick=pauseToggle;$$('.indicator').forEach((b,i)=>b.onclick=()=>{show(i);start()});main.addEventListener('pointerenter',()=>{hover=true;start()});main.addEventListener('pointerleave',()=>{hover=false;start()});main.addEventListener('focusin',()=>{focused=true;start()});main.addEventListener('focusout',()=>setTimeout(()=>{focused=main.matches(':focus-within');start()},0));document.addEventListener('visibilitychange',start);let mq=matchMedia('(prefers-reduced-motion: reduce)');mq.addEventListener?.('change',e=>{reduced=e.matches;start()});show(0);start()}
function initExplore(){let grid=$('#worldGrid');if(!grid)return;let category='ทั้งหมด',onlyFav=false;let type=new URLSearchParams(location.search).get('type');if(['ธรรมชาติ','ชายฝั่ง','เมือง'].includes(type)){category=type;$$('[data-category]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.category===category)))}function draw(){let q=$('#searchWorld').value.trim().toLocaleLowerCase('th'),sort=$('#sortWorld').value,favs=readFav();let list=WORLDS.filter(w=>(category==='ทั้งหมด'||w.category===category)&&(!onlyFav||favs.includes(w.id))&&(`${w.name} ${w.category} ${w.short}`.toLocaleLowerCase('th').includes(q)));if(sort==='popular')list.sort((a,b)=>parseFloat(b.visitors)-parseFloat(a.visitors));grid.innerHTML=list.map(worldCard).join('');$('#emptyState').style.display=list.length?'none':'block';$('#resultCount').textContent=`${list.length} โลก`;bindHearts(grid)}$('#searchWorld').addEventListener('input',draw);$('#sortWorld').addEventListener('change',draw);$$('[data-category]').forEach(b=>b.onclick=()=>{category=b.dataset.category;$$('[data-category]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));draw()});$('#favoritesOnly').addEventListener('click',e=>{onlyFav=!onlyFav;e.currentTarget.setAttribute('aria-pressed',String(onlyFav));e.currentTarget.innerHTML=onlyFav?'♥ รายการโปรดเท่านั้น':'♡ รายการโปรด';draw()});document.addEventListener('favorites-changed',draw);draw()}
function initDetail(){let root=$('#detailRoot');if(!root)return;let id=new URLSearchParams(location.search).get('id')||'aurora',w=WORLDS.find(x=>x.id===id);if(!w){$('#missingWorld').hidden=false;$('#detailBody').hidden=true;return}$('#detailBody').hidden=false;$('#missingWorld').hidden=true;$('#detailCategory').textContent=w.category+' · โลกตัวอย่าง';$('#detailTitle').textContent=w.name;$('#detailDescription').textContent=w.description;$('#detailMood').textContent=w.mood;$('#detailDuration').textContent=w.duration;$('#detailVisitors').textContent=w.visitors+' คน';$('#detailArt').className='detail-art scene-'+w.scene;$('#detailArt').setAttribute('aria-label','ภาพประกอบ 2D จำลอง: '+w.name);$('#detailFavorite').dataset.fav=w.id;paintHeart($('#detailFavorite'),w.id);bindHearts(root);$('#exploreMore').href='explore.html?type='+encodeURIComponent(w.category);$('#detailToast').onclick=()=>toast('นี่คือตัวอย่าง wireframe 2D ยังไม่มีฉาก 3D จริง');document.title=w.name+' · elsewhere.'}
function initSettings(){let form=$('#settingsForm');if(!form)return;let key='elsewhere.prefs.v2',p={};try{p=JSON.parse(localStorage.getItem(key)||'{}')}catch{}$$('[data-pref]',form).forEach(el=>{if(p[el.dataset.pref]!==undefined)el.type==='checkbox'?el.checked=p[el.dataset.pref]:el.value=p[el.dataset.pref]});$('#savePrefs').onclick=()=>{let x={};$$('[data-pref]',form).forEach(el=>x[el.dataset.pref]=el.type==='checkbox'?el.checked:el.value);localStorage.setItem(key,JSON.stringify(x));toast('บันทึกการตั้งค่าแล้ว')};$('#resetPrefs').onclick=()=>{localStorage.removeItem(key);form.reset();toast('คืนค่าตั้งต้นแล้ว')}}
initNav();initHome();initExplore();initDetail();initSettings();
</script></body></html>
